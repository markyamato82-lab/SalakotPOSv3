<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalakotPOS</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2315233b'/%3E%3Cpath d='M64 24 16 86c16 11 80 11 96 0z' fill='%23e0a43a'/%3E%3Cpath d='M64 24 42 90M64 24l22 66M64 24v68' stroke='%238a5d12' stroke-width='3.5' fill='none'/%3E%3Cpath d='M16 86c16 11 80 11 96 0' stroke='%232f6fd6' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='64' cy='24' r='7' fill='%232f6fd6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15233b; --ink-2:#1f3254; --ink-3:#2d4369;
  --paper:#f3f5f9; --cream:#ffffff; --chip:#eef2f8; --chip-2:#e1e8f2;
  --text:#18243a; --muted:#5f6c84; --faint:#8f9ab0; --line:#e0e6ef;
  --coral:#2f6fd6; --coral-d:#2459b3; --coral-bg:#e8f0fd; --coral-tx:#1f4fa3;
  --green:#2f9e74; --green-bg:#e3f4ec; --green-tx:#1d7653;
  --mango:#e0a43a; --mango-bg:#fff2d6; --mango-tx:#8a5d12;
  --red:#cf4b4b; --red-bg:#fde8e8; --red-tx:#a83434;
  --blue:#5f89bd; --blue-bg:#e8f0fb; --blue-tx:#44688f;
  --shadow:0 1px 0 rgba(17,44,50,.04),0 10px 30px -18px rgba(17,44,50,.28);
  --display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --k:1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1522; --cream:#141f31; --chip:#1b2840; --chip-2:#22324f;
    --text:#e8edf6; --muted:#9aa8c0; --faint:#6f7d96; --line:#24324b;
    --coral-bg:#1c2c4a; --coral-tx:#8fb4f5; --green-bg:#16302a; --green-tx:#86d3b3;
    --mango-bg:#382d17; --mango-tx:#f1c56f; --red-bg:#3a1f22; --red-tx:#f39a9b;
    --blue-bg:#1b2d44; --blue-tx:#9cc0ea; --shadow:0 10px 30px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1522; --cream:#141f31; --chip:#1b2840; --chip-2:#22324f;
    --text:#e8edf6; --muted:#9aa8c0; --faint:#6f7d96; --line:#24324b;
    --coral-bg:#1c2c4a; --coral-tx:#8fb4f5; --green-bg:#16302a; --green-tx:#86d3b3;
    --mango-bg:#382d17; --mango-tx:#f1c56f; --red-bg:#3a1f22; --red-tx:#f39a9b;
    --blue-bg:#1b2d44; --blue-tx:#9cc0ea; --shadow:0 10px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-scale="large"]{--k:1.16}
:root[data-scale="xl"]{--k:1.32}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);font:500 14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid color-mix(in srgb,var(--coral) 70%,transparent);outline-offset:2px;border-radius:10px}
.ic{flex:none;display:block}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}

/* Shell */
.side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--ink);color:#cfe0da;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand img{width:40px;height:40px;border-radius:12px}
.brand b{display:block;font:800 17px/1.1 var(--display);color:#f7f3ed;letter-spacing:-.02em}
.brand span{font-size:11.5px;color:#93b3aa}
.nav{flex:1;overflow-y:auto;scrollbar-width:thin}
.nav-group{margin:0 0 14px}
.nav-group p{margin:0 0 4px;padding:0 10px;font-size:11.5px;font-weight:700;color:#7fa39c}
.nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:0 10px;border-radius:12px;color:#b7cbc5;font-weight:700;font-size:13.5px;text-align:left}
.nav button:hover{background:var(--ink-2);color:#fff}
.nav button[aria-current="page"]{background:var(--coral);color:#fff}
.nav .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);border-radius:99px;padding:1px 7px}
.side-foot{border:1px solid var(--ink-3);background:#173b40;border-radius:16px;padding:11px;display:flex;align-items:center;gap:10px}
.side-foot img{width:34px;height:34px;border-radius:50%}
.side-foot b{display:block;color:#fff;font-size:12.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot span{font-size:11px;color:#9bbab1}
.main{margin-left:232px;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font:800 22px/1.15 var(--display);letter-spacing:-.035em}
.top .crumb{font-size:12.5px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.p-green{background:var(--green-bg);color:var(--green-tx)} .p-mango{background:var(--mango-bg);color:var(--mango-tx)}
.p-red{background:var(--red-bg);color:var(--red-tx)} .p-blue{background:var(--blue-bg);color:var(--blue-tx)} .p-gray{background:var(--chip);color:var(--muted)}
.page{padding:24px 28px 40px;max-width:1500px}
.ibtn.menu-btn{display:none}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--cream);color:var(--text);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--coral)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-ink:hover:not(:disabled){background:var(--ink-2)}
:root[data-theme="dark"] .btn-ink{background:var(--chip-2);border-color:var(--chip-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ink{background:var(--chip-2);border-color:var(--chip-2)}}
.btn-coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn-coral:hover:not(:disabled){background:var(--coral-d)}
.btn-coral:disabled,.btn-ink:disabled{background:var(--chip-2);border-color:var(--chip-2);color:var(--faint)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover:not(:disabled){background:var(--chip);border-color:transparent}
.btn-danger{color:var(--red-tx)}
.btn-sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.ibtn{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;color:var(--muted)}
.ibtn:hover{background:var(--chip);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.input,.select,textarea.input{width:100%;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--cream);padding:0 12px;font-weight:600;font-size:14px;color:var(--text);outline:none}
textarea.input{padding:10px 12px;min-height:70px;resize:vertical}
.input:focus,.select:focus{border-color:var(--coral)}
.input-icon{position:relative}
.input-icon .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.input-icon .input{padding-left:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--text)}
.check input{width:18px;height:18px;accent-color:var(--coral)}

/* Cards */
.card{background:var(--cream);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card h2,.h2{margin:0;font:800 17px/1.2 var(--display);letter-spacing:-.025em}
.card .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px}
.kpi p{margin:0;font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi .v{margin-top:6px;font:800 calc(27px*var(--k))/1.05 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .h{margin-top:7px;font-size:12px;color:var(--muted);font-weight:600}
.kpi.warn .v{color:var(--mango-tx)} .kpi.bad .v{color:var(--red-tx)} .kpi.good .v{color:var(--green-tx)}
.section{margin-top:16px}
.cols-2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
.cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar .input-icon{flex:1;min-width:200px;max-width:360px}
.toolbar .select{width:auto;min-height:40px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:10px 16px;background:color-mix(in srgb,var(--chip) 55%,var(--cream));white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle;font-size:13.5px}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in srgb,var(--chip) 40%,transparent)}
td .t1{font-weight:800} td .t2{font-size:12px;color:var(--muted);margin-top:2px}
.r{text-align:right} .nowrap{white-space:nowrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.tfoot{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* Sell */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.finder{padding:14px}
.search-big .input{min-height:52px;font-size:15.5px;padding-left:44px;padding-right:44px;border-radius:14px}
.search-big .ic{left:15px}
.search-big .scan{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.search-big .scan .ic{position:static;transform:none;color:inherit}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:700;background:var(--chip);color:var(--muted)}
.chip:hover{background:var(--chip-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:calc(132px*var(--k));text-align:left;padding:12px 13px 12px 17px;border-radius:16px;background:var(--cream);border:1px solid var(--line);overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--acc,var(--coral))}
.tile:hover:not(:disabled){border-color:var(--coral);transform:translateY(-1px)}
.tile:active:not(:disabled){transform:scale(.985)}
.tile:disabled{opacity:.5}
.tile .nm{padding-right:24px;font-weight:800;font-size:calc(14px*var(--k));line-height:1.22;letter-spacing:-.01em}
.tile .br{font-size:12px;color:var(--muted);margin-top:2px}
.tile .pr{font:800 calc(20px*var(--k))/1 var(--display);color:var(--coral-tx);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
:root:not([data-theme="dark"]) .tile .pr{color:var(--coral-d)}
.tile .st{font-size:11.5px;font-weight:700;color:var(--muted)}
.tile .st.low{color:var(--mango-tx)} .tile .st.out{color:var(--red-tx)}
.tile .incart{position:absolute;top:9px;right:9px;min-width:24px;height:24px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}

.ticket{position:sticky;top:86px;display:flex;flex-direction:column;max-height:calc(100vh - 106px);background:var(--cream);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
.ticket::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-11px;height:12px;background:linear-gradient(-45deg,transparent 8px,var(--cream) 0) 0 0/16px 12px repeat-x,linear-gradient(45deg,transparent 8px,var(--cream) 0) 0 0/16px 12px repeat-x;filter:drop-shadow(0 1px 0 var(--line))}
.t-head{padding:16px 18px 12px;border-bottom:1px dashed var(--line)}
.t-head h2{margin:0;font:800 18px/1.2 var(--display);letter-spacing:-.03em}
.cust-btn{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed color-mix(in srgb,var(--muted) 45%,transparent);border-radius:12px;padding:9px 11px;font-size:13px;font-weight:700;color:var(--muted);text-align:left}
.cust-btn.on{border-style:solid;border-color:var(--blue);color:var(--text);background:var(--blue-bg)}
.cust-btn:hover{border-color:var(--coral)}
.lines{flex:1;overflow-y:auto;padding:0 18px;min-height:120px}
.line{padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:800;font-size:calc(14px*var(--k))}
.line .meta{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:2px;background:var(--chip);border-radius:11px;padding:3px}
.qty button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.qty button:hover{background:var(--cream);color:var(--text)}
.qty input{width:42px;text-align:center;border:0;background:transparent;font-weight:800;font-size:14px;outline:none;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{display:none}
.disc{border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;background:var(--mango-bg);color:var(--mango-tx)}
.lt{font:800 calc(16px*var(--k))/1 var(--display);font-variant-numeric:tabular-nums}
.t-foot{padding:14px 18px 18px;border-top:1px dashed var(--line);background:color-mix(in srgb,var(--paper) 45%,var(--cream));border-radius:0 0 4px 4px}
.sum{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:3px 0}
.total{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.total span{font-weight:800;font-size:13px;color:var(--muted)}
.total b{font:800 calc(34px*var(--k))/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pay-btn{margin-top:12px;width:100%;min-height:56px;border-radius:16px;font-size:16px}
.kbd{font-size:11px;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 6px}
.mob-total{display:none}

/* Modal */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,28,32,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--cream);border-radius:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);animation:pop .16s ease-out}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}.tile:hover{transform:none}}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 0}
.m-head h2{margin:0;font:800 21px/1.2 var(--display);letter-spacing:-.035em}
.m-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.m-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.due{background:var(--ink);color:#f7f3ed;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-end}
.due span{font-size:13px;color:#a7c3bb;font-weight:700}
.due b{font:800 calc(42px*var(--k))/1 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.method{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:66px;border:1.5px solid var(--line);border-radius:14px;font-weight:700;font-size:12.5px;color:var(--muted)}
.method[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-bg);color:var(--coral-tx)}
.cash-in{display:flex;align-items:center;border:2px solid var(--line);border-radius:16px;padding:0 14px}
.cash-in:focus-within{border-color:var(--coral)}
.cash-in span{font:800 26px var(--display);color:var(--coral)}
.cash-in input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:800 30px/1 var(--display);padding:12px 8px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.change{font-weight:800;font-size:14px}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.n-warn{background:var(--mango-bg);color:var(--mango-tx)} .n-bad{background:var(--red-bg);color:var(--red-tx)} .n-info{background:var(--blue-bg);color:var(--blue-tx)} .n-ok{background:var(--green-bg);color:var(--green-tx)}
.pick{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pick button:hover{border-color:var(--coral)}

/* Receipt */
.receipt{background:#fffdf7;color:#17363a;border-radius:12px;padding:18px 16px;font-size:12.5px;border:1px solid var(--line)}
.receipt .c{text-align:center}
.receipt h3{margin:6px 0 2px;font:800 16px var(--display)}
.receipt hr{border:0;border-top:1px dashed #b9c6bf;margin:10px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt .tot{font:800 18px var(--display)}

/* Bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bar i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:color-mix(in srgb,var(--coral) 45%,var(--cream));min-height:3px}

    return setDiag("unreachable", "Supabase can't be reached from this browser", "The database is up, but this device can't connect to it.",
      ["If you opened the file inside Claude or another app, download it and open it in Chrome, Edge or Safari instead.", "Turn off ad-blockers or privacy extensions for this page.", "Try another network (some office or ISP filters block supabase.co).", "Test the connection: open " + SB_CFG.url + "/auth/v1/health in a new tab. A message about an API key means the connection works."], String(e && e.message || e));
  }
  try { body = await r.clone().json(); } catch { }
  const m = String(body.message || body.msg || "");
  if (r.ok) { DIAG.state = "ok"; schedule(); return true; }
  if (r.status === 401 || /api key/i.test(m)) return setDiag("badkey", "Supabase rejected the API key", "The publishable key in this file isn't accepted.", ["Copy the publishable key from Project Settings → API Keys and rebuild the file."], `${r.status}: ${m}`);

}

function cellText(c, v) {
  if (v == null || v === "") return "";
  if (c.t === "money") return peso(v); if (c.t === "pct") return pct(v); if (c.t === "int") return intf(v);
  if (c.t === "date") return fDate(String(v).length === 10 ? v + "T12:00:00+08:00" : v); if (c.t === "datetime") return fDT(v);
  return String(v);
}
function totalsRow(cols, rows) {
  const t = {}; let any = false;
  for (const c of cols) if (c.sum) { any = true; t[c.k] = rows.reduce((a, r) => a + (Number(r[c.k]) || 0), 0); }
  return any ? t : null;
}
function download(name, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function exportExcel(rep) {      // SpreadsheetML: opens natively in Excel with real numbers
  const x = s => String(s ?? "").replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
  const cell = (c, v) => (c.t === "money" || c.t === "int" || c.t === "pct") && v != null && v !== ""
    ? `<Cell ss:StyleID="${c.t === "money" ? "m" : c.t === "pct" ? "p" : "i"}"><Data ss:Type="Number">${c.t === "pct" ? Number(v) / 100 : Number(v)}</Data></Cell>`
    : `<Cell><Data ss:Type="String">${x(cellText(c, v))}</Data></Cell>`;
  const tot = totalsRow(rep.columns, rep.rows);
  const xml = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style><Style ss:ID="m"><NumberFormat ss:Format="#,##0.00"/></Style><Style ss:ID="p"><NumberFormat ss:Format="0.0%"/></Style><Style ss:ID="i"><NumberFormat ss:Format="#,##0"/></Style></Styles>
<Worksheet ss:Name="${x(rep.title.slice(0, 30)).replace(/[:\\/?*\[\]]/g, " ")}"><Table>
<Row><Cell ss:StyleID="h"><Data ss:Type="String">${x(rep.business)} — ${x(rep.title)}</Data></Cell></Row>
<Row><Cell><Data ss:Type="String">${x(fDate(rep.from + "T12:00:00+08:00"))} to ${x(fDate(rep.to + "T12:00:00+08:00"))}</Data></Cell></Row><Row/>
<Row>${rep.columns.map(c => `<Cell ss:StyleID="h"><Data ss:Type="String">${x(c.l)}</Data></Cell>`).join("")}</Row>
${rep.rows.map(r => `<Row>${rep.columns.map(c => cell(c, r[c.k])).join("")}</Row>`).join("\n")}
${tot ? `<Row>${rep.columns.map((c, i) => i === 0 ? `<Cell ss:StyleID="h"><Data ss:Type="String">Total</Data></Cell>` : c.sum ? cell(c, tot[c.k]) : "<Cell/>").join("")}</Row>` : ""}
</Table></Worksheet></Workbook>`;
  download(`${rep.kind}-${rep.from}-to-${rep.to}.xls`, xml, "application/vnd.ms-excel");
}
function exportCSV(rep) {
  const q = s => { s = String(s ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [rep.columns.map(c => q(c.l)).join(",")];
  for (const r of rep.rows) lines.push(rep.columns.map(c => q(c.t === "money" || c.t === "int" || c.t === "pct" ? (r[c.k] ?? "") : cellText(c, r[c.k]))).join(","));
  download(`${rep.kind}-${rep.from}-to-${rep.to}.csv`, "\ufeff" + lines.join("\r\n"), "text/csv");
}

  U.lgBusy = true; U.lgErr = ""; U.lgPct = 0; U.lgWho = ""; schedule();

  let tokenHash;
  try {
    const { data, error } = await SB.functions.invoke("pin-login", { body: { pin } });
    if (error) {
      let msg = ""; try { msg = (await error.context.json()).error || ""; } catch { }
      const e = new Error(msg || error.message); e.fromServer = !!msg; e.status = error.context && error.context.status; throw e;
    }

  if (r.error && /type|invalid/i.test(r.error.message || "")) r = await SB.auth.verifyOtp({ token_hash: tokenHash, type: "email" });
  U.lgPin = "";

}

async function orderRpc(name, args, okMsg) {

function payModal() {
  const o = U.order; const t = o.totals || {}; const due = Number(t.total_due);
  payModal.rows = [{ method: "CASH", amount: "", reference: "" }];
  payModal.unsent = (o.items || []).some(i => i.status === "NEW");
  const methods = Object.entries(METHOD_LABEL);
  const draw = () => {
    const box = document.querySelector("#modal [data-prows]"); if (!box) return;
    box.innerHTML = payModal.rows.map((r, i) => `<div class="prow">
      ${selInp("pm-" + i, methods, r.method, `data-prow="${i}" data-f="method"`)}
      <input id="pa-${i}" class="input num" inputmode="decimal" placeholder="Amount" value="${r.amount}" data-prow="${i}" data-f="amount">
      <input id="pr-${i}" class="input" placeholder="${r.method === "CASH" ? "—" : "Reference no."}" value="${esc(r.reference)}" data-prow="${i}" data-f="reference" ${r.method === "CASH" ? "disabled" : ""}>
      ${payModal.rows.length > 1 ? `<button class="ibtn" data-act="payRm" data-i="${i}" aria-label="Remove">${ic("x", 16)}</button>` : "<span></span>"}</div>`).join("");
    upd();
  };
  const upd = () => {
    const paid = r2(payModal.rows.reduce((a, r) => a + num(r.amount), 0)); const chg = r2(Math.max(0, paid - due));
    const el = id => document.getElementById(id);
    if (el("pay-paid")) { el("pay-paid").textContent = peso(paid); el("pay-chg").textContent = peso(chg); el("pay-short").textContent = paid < due ? `Short by ${peso(due - paid)}` : ""; }
    const b = document.querySelector("[data-act=payGo]"); if (b) b.disabled = paid < due - 0.001;
  };
  payModal.draw = draw;
  const quick = [...new Set([due, Math.ceil(due / 50) * 50, Math.ceil(due / 100) * 100, Math.ceil(due / 500) * 500, Math.ceil(due / 1000) * 1000])].filter(v => v >= due).slice(0, 5);
  openModal(`${mHead("Payment", esc(orderLabel(o)) + " · " + plural(o.guests, "guest"))}<div class="m-body">
    <div class="paybox"><div><span>Amount due</span><b>${peso(due)}</b></div><div><span>Payment</span><b id="pay-paid">₱0.00</b><small id="pay-short" style="color:var(--red-tx);font-weight:700"></small></div><div class="chg"><span>Change</span><b id="pay-chg">₱0.00</b></div></div>
    ${(o.items || []).some(i => i.status === "NEW") ? `<div class="notice n-info">Unsent items go to the kitchen when you complete the payment.</div>` : ""}
    <div data-prows style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="row wrap" style="gap:6px">${quick.map(v => `<button class="btn btn-sm" data-act="payQuick" data-v="${v}">${v === due ? "Exact" : peso(v)}</button>`).join("")}
      <button class="btn btn-sm btn-ghost" data-act="payAdd">${ic("plus", 14)} Split payment</button></div>
    <div data-err></div>
    <button class="btn btn-coral pay-btn" data-act="payGo" disabled>${ic("check", 20)} Complete payment</button></div>`, {
    wide: true, onMount: root => {
      draw();
      root.addEventListener("input", e => { const i = e.target.dataset.prow; if (i == null) return; payModal.rows[i][e.target.dataset.f] = e.target.value; upd(); });
      root.addEventListener("change", e => { const i = e.target.dataset.prow; if (i == null || e.target.dataset.f !== "method") return; const r = payModal.rows[i]; r.method = e.target.value;
        if (r.method !== "CASH" && !r.amount) { const rest = r2(due - payModal.rows.reduce((a, x, j) => a + (j == i ? 0 : num(x.amount)), 0)); if (rest > 0) r.amount = String(rest); } draw(); });
      setTimeout(() => document.getElementById("pa-0")?.focus(), 40);
    },
  });
}

/* ================= Kitchen display ================= */
function kitchenTickets() {
  const map = new Map();
  for (const i of S.openItems) {
    if (!["SENT", "READY"].includes(i.status) || i.station === "NONE") continue;
    if (U.station !== "ALL" && i.station !== U.station) continue;
    const k = `${i.order_id}|${i.ticket_no}|${i.station}`;
    if (!map.has(k)) map.set(k, { order: S.open.find(o => o.id === i.order_id), ticket: i.ticket_no, station: i.station, sent: i.sent_at, items: [] });
    map.get(k).items.push(i);
  }
  return [...map.values()].filter(t => t.order).sort((a, b) => new Date(a.sent) - new Date(b.sent));
}

/* ================= Find printers on this network ================= */
// Browsers can't list network devices, so we knock on each address (https://IP/) and time the reply:
// a real device answers or refuses within milliseconds; an empty address stays silent until timeout.
const SCAN = { base: "", running: false, done: 0, total: 0, found: [], blocked: false, note: "" };
function scanBases() {
  const set = new Set(S.printers.map(p => p.ip.split(".").slice(0, 3).join(".")).filter(b => /^\d+\.\d+\.\d+$/.test(b)));
  ["192.168.1", "192.168.0", "10.0.0", "172.16.0"].forEach(b => set.add(b));
  return [...set];
}
async function knock(ip, ms) {
  const t0 = performance.now();
  try { await fetch(`https://${ip}/`, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(ms) }); return { ip, alive: true, ms: performance.now() - t0, open: true }; }
  catch (e) { const ms2 = performance.now() - t0; return { ip, alive: e.name !== "TimeoutError" && e.name !== "AbortError" && ms2 < 1500, ms: ms2, open: false }; }
}
async function runScan() {
  const base = val("fs-base").trim().replace(/\.+$/, "");
  if (!/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(base) || base.split(".").some(n => +n > 255)) { mErr("Enter the first three parts of the address, e.g. 192.168.1"); return; }
  Object.assign(SCAN, { base, running: true, done: 0, total: 254, found: [], blocked: false, note: "Asking the browser for permission to reach your network… If Chrome asks, choose Allow." });
  drawScan();
  // warm-up: lets Chrome show its local-network permission prompt before the real scan
  await knock(base + ".1", 20000);
  SCAN.note = "";
  const ips = Array.from({ length: 254 }, (_, i) => `${base}.${i + 1}`);
  const results = []; let next = 0;
  const worker = async () => { while (SCAN.running && next < ips.length) { const ip = ips[next++]; const r = await knock(ip, 2500); results.push(r); SCAN.done++; if (r.alive) SCAN.found.push(r); drawScan(); } };
  await Promise.all(Array.from({ length: 24 }, worker));
  // if nearly every address "answers" instantly, the browser is refusing all of them (permission or policy), not real devices
  if (SCAN.found.length > 200) { SCAN.found = []; SCAN.blocked = true; }
  SCAN.found.sort((a, b) => +a.ip.split(".")[3] - +b.ip.split(".")[3]);
  SCAN.running = false; drawScan();
}
function drawScan() {
  const box = document.querySelector("#modal [data-scan]"); if (!box) return;
  const pctDone = SCAN.total ? Math.round(SCAN.done / SCAN.total * 100) : 0;
  const known = new Map(S.printers.map(p => [p.ip, p]));
  box.innerHTML = `
    ${SCAN.running ? `<div class="lg-prog"><div class="spread"><span class="lg-step">${esc(SCAN.note || `Checking ${SCAN.done} of ${SCAN.total} addresses…`)}</span><span class="lg-pct">${pctDone}%</span></div>
      <div class="lg-bar ${SCAN.note ? "indet" : ""}" role="progressbar" aria-valuenow="${pctDone}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pctDone}%"></i></div></div>` : ""}
    ${SCAN.blocked ? `<div class="notice n-bad">The browser blocked the search, so no devices could be checked. Click the icon left of the address bar → Site settings → set <b>Local network access</b> to <b>Allow</b>, reload, and search again.</div>` : ""}
    ${SCAN.found.length ? `<div class="pick" style="max-height:340px">${SCAN.found.map(r => { const k = known.get(r.ip);
        return `<div class="spread" style="border:1px solid var(--line);border-radius:12px;padding:8px 12px;gap:10px">
          <span style="min-width:0"><b class="mono">${esc(r.ip)}</b>${r.ip.endsWith(".1") ? ` ${badge("Probably your router", "gray")}` : ""}${k ? ` ${badge("Added: " + k.name, "green")}` : ""}<br>
          <span class="muted" style="font-size:12px">Answered in ${Math.round(r.ms)} ms${r.open ? " · secure page already trusted" : ""}</span></span>
          <span class="row" style="gap:6px;flex-shrink:0"><button class="btn btn-sm btn-ghost" data-act="scanOpen" data-ip="${esc(r.ip)}">Open page</button>
          ${k ? "" : `<button class="btn btn-sm btn-coral" data-act="scanAdd" data-ip="${esc(r.ip)}">${ic("plus", 14)} Add printer</button>`}</span></div>`; }).join("")}</div>`
      : !SCAN.running && SCAN.done && !SCAN.blocked ? `<div class="notice n-warn">No devices answered on ${esc(SCAN.base)}.x. Check that this device is on the same Wi-Fi as the printer, or try another address range. A printer's address is also on its status sheet (on most Epson TM models: switch off, hold Feed, switch on).</div>` : ""}
    ${!SCAN.running && SCAN.found.length ? `<p class="hint" style="margin:0">Not sure which one is the printer? Tap <b>Open page</b>: a printer shows its own settings page. If the browser warns about the connection, choose Advanced → Proceed; that's normal for printers and also lets SalakotPOS print to it later.</p>` : ""}`;
  const go = document.querySelector("#modal [data-act=scanStart]"); if (go) { go.disabled = SCAN.running; go.innerHTML = SCAN.running ? "Searching…" : `${ic("search", 16)} ${SCAN.done ? "Search again" : "Search"}`; }
}
function findPrintersModal() {
  const bases = scanBases(); SCAN.running = false; SCAN.done = 0; SCAN.found = []; SCAN.blocked = false;
  openModal(`${mHead("Find printers on this network", "Checks every address in a range and lists the devices that answer.")}<div class="m-body">
    <div class="grid2" style="align-items:end">${fld("Address range (first three parts)", inp("fs-base", bases[0], 'inputmode="decimal" spellcheck="false" autocomplete="off"'))}
      <button class="btn btn-coral" data-act="scanStart">${ic("search", 16)} Search</button></div>
    <div class="row wrap" style="gap:6px;margin-top:-4px">${bases.map(b => `<button class="chip" data-act="scanBase" data-v="${b}">${b}.x</button>`).join("")}</div>
    <p class="hint" style="margin:0">Use the range your Wi-Fi uses. It's the start of your printer's or router's address, e.g. 192.168.1 for 192.168.1.50. Takes up to about 30 seconds.</p>
    <div data-scan style="display:flex;flex-direction:column;gap:10px"></div><div data-err></div></div>`, { wide: true, onClose: () => { SCAN.running = false; }, onMount: drawScan });
}

/* ================= Android app (Capacitor) ================= */
// The same SalakotPOS runs inside the Android app. There, a native module prints straight to
// network printers (ESC/POS on port 9100, any brand) and paired Bluetooth printers.
const CAP = () => window.Capacitor || window.__cap;
const IS_APP = () => { const c = CAP(); return !!(c && c.isNativePlatform && c.isNativePlatform()); };
const NP = () => { const c = CAP(); return c && c.Plugins && c.Plugins.SalakotPrinter; };
const KIND_LABEL = { ESCPOS_IMIN: "Built-in printer (iMin)", ESCPOS_TCP: "Network (port 9100)", ESCPOS_BT: "Bluetooth", EPSON_EPOS: "Epson ePOS (web)" };
const IMIN = () => { const c = CAP(); return c && c.Plugins && c.Plugins.SalakotPrinter; };
let iminAvail = false;
if (IS_APP() && NP() && NP().iminAvailable) { NP().iminAvailable().then(r => { iminAvail = !!(r && r.available); schedule(); }).catch(() => {}); }

function escposBytes(lines, w, opts = {}) {
  const out = []; const push = (...b) => { for (const x of b) out.push(x); };
  const text = s => { for (const ch of s) { const c = ch.charCodeAt(0); out.push(c < 128 ? c : 63); } };
  push(0x1B, 0x40);                 // initialise
  push(0x1B, 0x74, 0x00);           // basic character table
  for (const l of lines) {
    push(0x1B, 0x61, l.a === "center" ? 1 : l.a === "right" ? 2 : 0);   // align
    push(0x1B, 0x45, l.b ? 1 : 0);                                        // bold
    push(0x1D, 0x21, (l.dw ? 0x10 : 0) | (l.dh ? 0x01 : 0));              // double width / height
    text(l.rule ? "-".repeat(w) : l.t); push(0x0A);
  }
  push(0x1B, 0x45, 0, 0x1D, 0x21, 0, 0x1B, 0x61, 0);
  push(0x1B, 0x64, 3);              // feed 3 lines
  push(0x1D, 0x56, 0x42, 0x00);     // feed and partial cut
  if (opts.drawer) push(0x1B, 0x70, 0x00, 0x19, 0xFA);   // open cash drawer
  return Uint8Array.from(out);
}
const toB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const nativeErr = e => (e && (e.message || e.errorMessage)) || String(e);

async function sendToPrinter(p, lines, opts = {}) {
  const kind = p.kind || "EPSON_EPOS";
  if (kind === "EPSON_EPOS") return sendEpos(p, lines);
  if (!IS_APP() || !NP()) throw new Error(`${p.name} is a ${kind === "ESCPOS_BT" ? "Bluetooth" : kind === "ESCPOS_IMIN" ? "built-in" : "network (port 9100)"} printer. Only the SalakotPOS Android app can print to it.`);
  try {
    if (kind === "ESCPOS_IMIN") { await NP().printImin({ lines: lines.map(l => ({ t: l.t || "", a: l.a || "left", b: !!l.b, dw: !!l.dw, dh: !!l.dh, rule: !!l.rule })), paper: pcols(p) === 32 ? 58 : 80, cut: true, drawer: !!(opts.drawer && p.open_drawer) }); return true; }
    const data = toB64(escposBytes(lines, pcols(p), { drawer: !!(opts.drawer && p.open_drawer) }));
    if (kind === "ESCPOS_BT") await NP().printBluetooth({ address: p.ip, data });
    else await NP().printRaw({ host: p.ip, port: p.port || 9100, data, timeout: 6000 });
  } catch (e) { throw new Error(nativeErr(e)); }
  return true;
}

if (IS_APP()) {
  // print dialog -> Android's print service (Mopria, PDF, installed print plugins)
  printHTML = function (html, cls) {
    const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");
    const doc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>${css}</style>
      <style>body{background:#fff!important;margin:0;padding:8px}#printable{position:static!important;left:auto!important}</style></head>
      <body><div id="printable" class="${cls || ""}">${html}</div></body></html>`;
    if (!NP()) { toast("Printing isn't available on this device.", true); return; }
    NP().printHtml({ name: "SalakotPOS", html: doc }).catch(e => toast(nativeErr(e), true));
  };
  // Excel / CSV exports -> Android share sheet (Drive, Gmail, Files…)
  download = async function (name, data, type) {
    try {
      const buf = new Uint8Array(await new Blob([data], { type }).arrayBuffer());
      await NP().shareFile({ name, mime: type || "application/octet-stream", data: toB64(buf) });
    } catch (e) { toast(nativeErr(e), true); }
  };
}

    if (k === "ESCPOS_IMIN" && !printerEditModal.id) { const pp = document.getElementById("pe-paper"); if (pp) pp.value = "58mm"; }
  };
  body.querySelector("#pe-kind").addEventListener("change", sync); body.querySelector("#pe-role").addEventListener("change", sync); sync();

const _printerForm = printerForm;

/* ---------- Find printers: real port-9100 search in the app ---------- */
const _runScan = runScan;
runScan = async function () {
  if (!IS_APP() || !NP()) return _runScan();
  const base = val("fs-base").trim().replace(/\.+$/, "");
  if (!/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(base)) { mErr("Enter the first three parts of the address, e.g. 192.168.1"); return; }
  Object.assign(SCAN, { base, running: true, done: 0, total: 254, found: [], blocked: false, note: "Looking for printers on this Wi-Fi…" }); drawScan();
  try {
    const r = await NP().scan({ base, port: 9100, timeout: 500 });
    SCAN.found = ((r && r.found) || []).map(ip => ({ ip, alive: true, ms: 0, open: true, printer: true }));
  } catch (e) { mErr(nativeErr(e)); }
  SCAN.done = SCAN.total; SCAN.note = ""; SCAN.running = false; drawScan();
};
const _findPrintersModal = findPrintersModal;
findPrintersModal = function () {
  _findPrintersModal();
  if (!IS_APP() || !NP()) return;
  const sub = document.querySelector("#modal .m-head p, #modal .m-head .muted"); if (sub) sub.textContent = "Lists printers on this tablet's Wi-Fi that accept printing on port 9100.";
  NP().networkInfo().then(r => { if (r && r.base) { const i = document.getElementById("fs-base"); if (i) i.value = r.base; } }).catch(() => { });
};
const _drawScan = drawScan;
drawScan = function () {
  _drawScan();
  if (!IS_APP()) return;
  document.querySelectorAll("#modal [data-scan] .muted").forEach(el => { if (/Answered in/.test(el.textContent)) el.textContent = "Printer port 9100 is open"; });
  if (!SCAN.running && SCAN.done && !SCAN.found.length) { const n = document.querySelector("#modal [data-scan] .notice.n-warn"); if (n) n.textContent = "No printers found on this range. Check the printer is on and connected to the same Wi-Fi or router as this tablet. Its address is on its self-test page (hold the Feed button while switching it on)."; }
};
const _scanAdd = ACT.scanAdd;
ACT.scanAdd = el => { _scanAdd(el); if (!IS_APP()) return; setTimeout(() => { const k = document.getElementById("pe-kind"); if (k) { k.value = "ESCPOS_TCP"; k.dispatchEvent(new Event("change")); } }, 60); };
