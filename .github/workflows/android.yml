# Builds the SalakotPOS Android app (APK) and publishes it on the repository's Releases page.
# Runs when anything in android-app/ changes, or manually: Actions -> Build Android app -> Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SALAKOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/salakot.jks"
            echo "SALAKOT_KEYSTORE_FILE=$RUNNER_TEMP/salakot.jks" >> "$GITHUB_ENV"
            echo "Signing key loaded: building a signed release APK."
          else
            echo "::warning::No signing key secret found, so this is a debug APK. Add the SALAKOT_* secrets so updates install over the previous version."
          fi

      - name: Build the APK
        working-directory: android-app/android
        env:
          SALAKOT_KEYSTORE_PASSWORD: ${{ secrets.SALAKOT_KEYSTORE_PASSWORD }}
          SALAKOT_KEY_ALIAS: ${{ secrets.SALAKOT_KEY_ALIAS }}
          SALAKOT_KEY_PASSWORD: ${{ secrets.SALAKOT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          if [ -n "$SALAKOT_KEYSTORE_FILE" ]; then
            TASK=assembleRelease; OUT=app/build/outputs/apk/release/app-release.apk
          else
            TASK=assembleDebug; OUT=app/build/outputs/apk/debug/app-debug.apk
          fi
          ./gradlew "$TASK" -PsalakotVersionCode="$GITHUB_RUN_NUMBER" -PsalakotVersionName="$VERSION" --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$OUT" "$GITHUB_WORKSPACE/dist/SalakotPOS-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: SalakotPOS-${{ env.VERSION }}
          path: dist/*.apk

      - name: Publish on the Releases page
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION}" dist/*.apk \
            --title "SalakotPOS Android ${VERSION}" \
            --notes "Install on each tablet: open this page on the tablet, tap the .apk file, and allow installing from this source if Android asks. Updates install over the previous version and keep the tablet's settings."
