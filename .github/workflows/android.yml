# Builds the SalakotPOS Android app (APK) and publishes it on the repository's Releases page.
# Runs when anything in android-app/ changes, or manually: Actions -> Build Android app -> Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          ./gradlew assembleRelease -PsalakotVersionCode="$GITHUB_RUN_NUMBER" -PsalakotVersionName="$VERSION" --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/SalakotPOS-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: SalakotPOS-${{ env.VERSION }}
          path: dist/*.apk

      - name: Publish on the Releases page
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION}" dist/*.apk \
            --title "SalakotPOS Android ${VERSION}" \
            --notes "Install on each tablet: open this page on the tablet, tap the .apk file, and allow installing from this source if Android asks. Updates install over the previous version and keep the tablet's settings."
