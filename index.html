<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalakotPOS</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2315233b'/%3E%3Cpath d='M64 24 16 86c16 11 80 11 96 0z' fill='%23e0a43a'/%3E%3Cpath d='M16 86c16 11 80 11 96 0' stroke='%232f6fd6' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#f3f5f9;color:#15233b;font:600 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#0d1626;color:#e6ecf5}}
  .box{text-align:center;padding:24px;max-width:360px}
  .bar{width:180px;height:6px;border-radius:9px;background:rgba(47,111,214,.18);overflow:hidden;margin:18px auto 0}
  .bar i{display:block;width:40%;height:100%;background:#2f6fd6;border-radius:9px;animation:s 1.1s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  .err{color:#b42318;margin-top:14px}
  button{margin-top:14px;font:inherit;padding:10px 18px;border-radius:12px;border:0;background:#2f6fd6;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="box"><b>Opening SalakotPOS…</b><div class="bar"><i></i></div></div>
<script>
/* SalakotPOS launcher: loads the latest app version from the restaurant's Supabase project.
   Upload this file to Netlify once; app updates then arrive automatically. */
(async () => {
  const API = "https://osllqdmaxurdvqjocbab.supabase.co/rest/v1/app_releases?select=id,version,bundle_b64&order=id.desc&limit=1";
  const KEY = "sb_publishable_EHimT2l3dYpw5rwwBx_U0w_sdWvma8c";
  const box = document.getElementById("box");
  let rel = null, offline = false;
  try {
    const r = await fetch(API, { headers: { apikey: KEY }, cache: "no-store" });
    if (r.ok) rel = (await r.json())[0] || null;
  } catch (e) { offline = true; }
  if (rel) { try { localStorage.setItem("s-app-release", JSON.stringify(rel)); } catch (e) { } }
  else { try { rel = JSON.parse(localStorage.getItem("s-app-release")); } catch (e) { } }
  if (!rel) {
    box.innerHTML = '<b>SalakotPOS couldn\'t load.</b><div class="err">' + (offline ? "This device isn't connected to the internet." : "The app isn't available right now.") +
      '</div><button onclick="location.reload()">Try again</button>';
    return;
  }
  try {
    const bin = atob(rel.bundle_b64); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    sessionStorage.setItem("s-rel-id", String(rel.id));
    document.open(); document.write(html); document.close();
  } catch (e) {
    box.innerHTML = '<b>SalakotPOS couldn\'t start.</b><div class="err">This browser may be too old. Update Chrome, Edge or Safari and try again.</div><button onclick="location.reload()">Try again</button>';
  }
})();
</script>
</body>
</html>
